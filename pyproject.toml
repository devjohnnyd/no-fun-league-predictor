[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "no-fun-league-predictor"
version = "4.0.0"
description = "Auditable NFL forecasts with chronological model evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<4", "tzdata>=2024.1"]

[project.scripts]
nfl-predictor = "nfl_predictor.cli:main"

[tool.setuptools.packages.find]
include = ["nfl_predictor*"]
